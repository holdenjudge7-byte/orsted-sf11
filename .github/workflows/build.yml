name: Build Orsted SF11 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Fetch Stockfish 11 Source
        run: |
          echo "Downloading Stockfish 11..."
          curl -sL -o sf.zip https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_11.zip
          unzip -q sf.zip
          mkdir -p app/src/main/cpp/stockfish
          cp -r Stockfish-sf_11/src/* app/src/main/cpp/stockfish/

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.6

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orsted-sf11-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
